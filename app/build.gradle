plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gigabyte.rgbfusion'
    compileSdk 33

    defaultConfig {
        applicationId 'com.rgbfusion.remote'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.all { enabled = false }   // CoreSelfTest is a plain main() program, see README
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
